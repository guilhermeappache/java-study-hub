<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="3600" viewBox="0 0 1080 1800" role="img" aria-labelledby="title desc"><title id="title">Threads e assincronismo</title><desc id="desc">Thread · iniciar e aguardar. start() inicia uma nova thread.. run() direto usa a thread atual.. Thread.join() aguarda outra thread.. Pool · administrar recursos. ExecutorService organiza tarefas.. Pools podem reutilizar threads.. Encerre os executores após o uso.. Virtual Threads · Java 21. Leves; úteis para muitas esperas de I/O.. Não tornam CPU automaticamente mais rápida.. O pool de conexões continua sendo um limite.. CompletableFuture · compor. thenApply transforma o resultado.. thenCompose encadeia outro futuro.. thenCombine reúne resultados independentes.. No Canna · resultados e falhas. Nome + total → Carlos possui 3 agendamentos.. exceptionally pode recuperar uma falha.. join() espera; pode lançar CompletionException.</desc><rect width="1080" height="1800" fill="#0b1120"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="64" y="70" fill="#61d5bf" font-size="22" letter-spacing="3">JAVA STUDY HUB / MAPA 05</text><text x="64" y="145" fill="#eef4ff" font-weight="bold" font-size="48">Threads e assincronismo</text><text x="64" y="198" fill="#a7b7cc" font-size="28">Executar, esperar e combinar resultados</text><rect x="64" y="242" width="952" height="92" rx="22" fill="#1b3440" stroke="#61d5bf"/><text x="540" y="299" text-anchor="middle" fill="#eef4ff" font-size="32" font-weight="bold">FUNDAMENTOS JAVA · 05</text><path d="M104 334 V1570" fill="none" stroke="#34465f" stroke-width="5"/><path d="M104 418 H156" stroke="#61d5bf" stroke-width="5"/><circle cx="104" cy="418" r="12" fill="#61d5bf"/><rect x="156" y="374" width="860" height="218" rx="20" fill="#111c2e" stroke="#29384e"/><rect x="156" y="392" width="5" height="182" rx="2" fill="#61d5bf"/><text x="184" y="422" fill="#61d5bf" font-size="33" font-weight="bold">Thread · iniciar e aguardar</text><text x="184" y="473" fill="#eef4ff" font-size="29">start() inicia uma nova thread.</text><text x="184" y="517" fill="#eef4ff" font-size="29">run() direto usa a thread atual.</text><text x="184" y="561" fill="#eef4ff" font-size="29">Thread.join() aguarda outra thread.</text><path d="M104 666 H156" stroke="#81b9ff" stroke-width="5"/><circle cx="104" cy="666" r="12" fill="#81b9ff"/><rect x="156" y="622" width="860" height="218" rx="20" fill="#111c2e" stroke="#29384e"/><rect x="156" y="640" width="5" height="182" rx="2" fill="#81b9ff"/><text x="184" y="670" fill="#81b9ff" font-size="33" font-weight="bold">Pool · administrar recursos</text><text x="184" y="721" fill="#eef4ff" font-size="29">ExecutorService organiza tarefas.</text><text x="184" y="765" fill="#eef4ff" font-size="29">Pools podem reutilizar threads.</text><text x="184" y="809" fill="#eef4ff" font-size="29">Encerre os executores após o uso.</text><path d="M104 914 H156" stroke="#c3a1ff" stroke-width="5"/><circle cx="104" cy="914" r="12" fill="#c3a1ff"/><rect x="156" y="870" width="860" height="218" rx="20" fill="#111c2e" stroke="#29384e"/><rect x="156" y="888" width="5" height="182" rx="2" fill="#c3a1ff"/><text x="184" y="918" fill="#c3a1ff" font-size="33" font-weight="bold">Virtual Threads · Java 21</text><text x="184" y="969" fill="#eef4ff" font-size="29">Leves; úteis para muitas esperas de I/O.</text><text x="184" y="1013" fill="#eef4ff" font-size="29">Não tornam CPU automaticamente mais rápida.</text><text x="184" y="1057" fill="#eef4ff" font-size="29">O pool de conexões continua sendo um limite.</text><path d="M104 1162 H156" stroke="#ffc879" stroke-width="5"/><circle cx="104" cy="1162" r="12" fill="#ffc879"/><rect x="156" y="1118" width="860" height="218" rx="20" fill="#111c2e" stroke="#29384e"/><rect x="156" y="1136" width="5" height="182" rx="2" fill="#ffc879"/><text x="184" y="1166" fill="#ffc879" font-size="33" font-weight="bold">CompletableFuture · compor</text><text x="184" y="1217" fill="#eef4ff" font-size="29">thenApply transforma o resultado.</text><text x="184" y="1261" fill="#eef4ff" font-size="29">thenCompose encadeia outro futuro.</text><text x="184" y="1305" fill="#eef4ff" font-size="29">thenCombine reúne resultados independentes.</text><path d="M104 1410 H156" stroke="#f69fba" stroke-width="5"/><circle cx="104" cy="1410" r="12" fill="#f69fba"/><rect x="156" y="1366" width="860" height="218" rx="20" fill="#111c2e" stroke="#29384e"/><rect x="156" y="1384" width="5" height="182" rx="2" fill="#f69fba"/><text x="184" y="1414" fill="#f69fba" font-size="33" font-weight="bold">No Canna · resultados e falhas</text><text x="184" y="1465" fill="#eef4ff" font-size="29">Nome + total → Carlos possui 3 agendamentos.</text><text x="184" y="1509" fill="#eef4ff" font-size="29">exceptionally pode recuperar uma falha.</text><text x="184" y="1553" fill="#eef4ff" font-size="29">join() espera; pode lançar CompletionException.</text><text x="64" y="1706" fill="#61d5bf" font-size="29" font-weight="bold">Concorrência não significa execução paralela.</text><text x="64" y="1760" fill="#a7b7cc" font-size="23">Módulo 01 · Revisão para entrevistas · Amplie sem perder nitidez</text></g></svg>

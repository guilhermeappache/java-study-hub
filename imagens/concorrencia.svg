<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="3600" viewBox="0 0 1080 1800" role="img" aria-labelledby="title desc"><title id="title">Concorrência e atomicidade</title><desc id="desc">Race condition · ordem importa. contador++ envolve várias etapas.. Acesso simultâneo pode perder atualizações.. Thread safety exige garantias explícitas.. ConcurrentHashMap · uma JVM. Suporta acesso concorrente ao mapa.. Use putIfAbsent, compute ou merge.. Chamadas separadas não formam um todo atômico.. Banco · várias instâncias. Cada processo tem sua própria memória.. UNIQUE protege uma chave no banco.. Transações agrupam alterações.. Mensagens · repetir com segurança. Idempotência evita efeitos duplicados.. Outbox grava dado e evento na transação.. Um publicador envia o evento depois.. No Canna · agendar e notificar. Garanta a regra de negócio no banco.. Falhou o envio? Reprocesse o evento.. Deduplicate ao consumir a mensagem.</desc><rect width="1080" height="1800" fill="#0b1120"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="64" y="70" fill="#61d5bf" font-size="22" letter-spacing="3">JAVA STUDY HUB / MAPA 04</text><text x="64" y="145" fill="#eef4ff" font-weight="bold" font-size="48">Concorrência e atomicidade</text><text x="64" y="198" fill="#a7b7cc" font-size="28">Da memória local às garantias no banco</text><rect x="64" y="242" width="952" height="92" rx="22" fill="#1b3440" stroke="#61d5bf"/><text x="540" y="299" text-anchor="middle" fill="#eef4ff" font-size="32" font-weight="bold">FUNDAMENTOS JAVA · 04</text><path d="M104 334 V1570" fill="none" stroke="#34465f" stroke-width="5"/><path d="M104 418 H156" stroke="#61d5bf" stroke-width="5"/><circle cx="104" cy="418" r="12" fill="#61d5bf"/><rect x="156" y="374" width="860" height="218" rx="20" fill="#111c2e" stroke="#29384e"/><rect x="156" y="392" width="5" height="182" rx="2" fill="#61d5bf"/><text x="184" y="422" fill="#61d5bf" font-size="33" font-weight="bold">Race condition · ordem importa</text><text x="184" y="473" fill="#eef4ff" font-size="29">contador++ envolve várias etapas.</text><text x="184" y="517" fill="#eef4ff" font-size="29">Acesso simultâneo pode perder atualizações.</text><text x="184" y="561" fill="#eef4ff" font-size="29">Thread safety exige garantias explícitas.</text><path d="M104 666 H156" stroke="#81b9ff" stroke-width="5"/><circle cx="104" cy="666" r="12" fill="#81b9ff"/><rect x="156" y="622" width="860" height="218" rx="20" fill="#111c2e" stroke="#29384e"/><rect x="156" y="640" width="5" height="182" rx="2" fill="#81b9ff"/><text x="184" y="670" fill="#81b9ff" font-size="33" font-weight="bold">ConcurrentHashMap · uma JVM</text><text x="184" y="721" fill="#eef4ff" font-size="29">Suporta acesso concorrente ao mapa.</text><text x="184" y="765" fill="#eef4ff" font-size="29">Use putIfAbsent, compute ou merge.</text><text x="184" y="809" fill="#eef4ff" font-size="29">Chamadas separadas não formam um todo atômico.</text><path d="M104 914 H156" stroke="#c3a1ff" stroke-width="5"/><circle cx="104" cy="914" r="12" fill="#c3a1ff"/><rect x="156" y="870" width="860" height="218" rx="20" fill="#111c2e" stroke="#29384e"/><rect x="156" y="888" width="5" height="182" rx="2" fill="#c3a1ff"/><text x="184" y="918" fill="#c3a1ff" font-size="33" font-weight="bold">Banco · várias instâncias</text><text x="184" y="969" fill="#eef4ff" font-size="29">Cada processo tem sua própria memória.</text><text x="184" y="1013" fill="#eef4ff" font-size="29">UNIQUE protege uma chave no banco.</text><text x="184" y="1057" fill="#eef4ff" font-size="29">Transações agrupam alterações.</text><path d="M104 1162 H156" stroke="#ffc879" stroke-width="5"/><circle cx="104" cy="1162" r="12" fill="#ffc879"/><rect x="156" y="1118" width="860" height="218" rx="20" fill="#111c2e" stroke="#29384e"/><rect x="156" y="1136" width="5" height="182" rx="2" fill="#ffc879"/><text x="184" y="1166" fill="#ffc879" font-size="33" font-weight="bold">Mensagens · repetir com segurança</text><text x="184" y="1217" fill="#eef4ff" font-size="29">Idempotência evita efeitos duplicados.</text><text x="184" y="1261" fill="#eef4ff" font-size="29">Outbox grava dado e evento na transação.</text><text x="184" y="1305" fill="#eef4ff" font-size="29">Um publicador envia o evento depois.</text><path d="M104 1410 H156" stroke="#f69fba" stroke-width="5"/><circle cx="104" cy="1410" r="12" fill="#f69fba"/><rect x="156" y="1366" width="860" height="218" rx="20" fill="#111c2e" stroke="#29384e"/><rect x="156" y="1384" width="5" height="182" rx="2" fill="#f69fba"/><text x="184" y="1414" fill="#f69fba" font-size="33" font-weight="bold">No Canna · agendar e notificar</text><text x="184" y="1465" fill="#eef4ff" font-size="29">Garanta a regra de negócio no banco.</text><text x="184" y="1509" fill="#eef4ff" font-size="29">Falhou o envio? Reprocesse o evento.</text><text x="184" y="1553" fill="#eef4ff" font-size="29">Deduplicate ao consumir a mensagem.</text><text x="64" y="1706" fill="#61d5bf" font-size="29" font-weight="bold">Mapa local não substitui garantias do banco.</text><text x="64" y="1760" fill="#a7b7cc" font-size="23">Módulo 01 · Revisão para entrevistas · Amplie sem perder nitidez</text></g></svg>

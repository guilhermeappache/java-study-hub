<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="3600" viewBox="0 0 1080 1800" role="img" aria-labelledby="title desc"><title id="title">Plataforma Java e JVM</title><desc id="desc">JDK · desenvolver. javac compila arquivos .java.. Inclui ferramentas e runtime.. JRE = JVM + bibliotecas de execução.. Bytecode · transportar. javac: .java → .class. Bytecode é código intermediário.. Exige uma JVM compatível para rodar.. ClassLoader · carregar. Localiza e define classes sob demanda.. Delegação usual: bootstrap →. platform → application.. JVM e JIT · executar. A JVM executa o bytecode.. O JIT compila trechos quentes. para código de máquina otimizado.. No Canna · conectar as ideias. Você desenvolve usando o JDK.. A JVM executa o backend Java.. O JIT otimiza durante a execução.</desc><rect width="1080" height="1800" fill="#0b1120"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="64" y="70" fill="#61d5bf" font-size="22" letter-spacing="3">JAVA STUDY HUB / MAPA 01</text><text x="64" y="145" fill="#eef4ff" font-weight="bold" font-size="48">Plataforma Java e JVM</text><text x="64" y="198" fill="#a7b7cc" font-size="28">Do código-fonte à execução</text><rect x="64" y="242" width="952" height="92" rx="22" fill="#1b3440" stroke="#61d5bf"/><text x="540" y="299" text-anchor="middle" fill="#eef4ff" font-size="32" font-weight="bold">FUNDAMENTOS JAVA · 01</text><path d="M104 334 V1570" fill="none" stroke="#34465f" stroke-width="5"/><path d="M104 418 H156" stroke="#61d5bf" stroke-width="5"/><circle cx="104" cy="418" r="12" fill="#61d5bf"/><rect x="156" y="374" width="860" height="218" rx="20" fill="#111c2e" stroke="#29384e"/><rect x="156" y="392" width="5" height="182" rx="2" fill="#61d5bf"/><text x="184" y="422" fill="#61d5bf" font-size="33" font-weight="bold">JDK · desenvolver</text><text x="184" y="473" fill="#eef4ff" font-size="29">javac compila arquivos .java.</text><text x="184" y="517" fill="#eef4ff" font-size="29">Inclui ferramentas e runtime.</text><text x="184" y="561" fill="#eef4ff" font-size="29">JRE = JVM + bibliotecas de execução.</text><path d="M104 666 H156" stroke="#81b9ff" stroke-width="5"/><circle cx="104" cy="666" r="12" fill="#81b9ff"/><rect x="156" y="622" width="860" height="218" rx="20" fill="#111c2e" stroke="#29384e"/><rect x="156" y="640" width="5" height="182" rx="2" fill="#81b9ff"/><text x="184" y="670" fill="#81b9ff" font-size="33" font-weight="bold">Bytecode · transportar</text><text x="184" y="721" fill="#eef4ff" font-size="29">javac: .java → .class</text><text x="184" y="765" fill="#eef4ff" font-size="29">Bytecode é código intermediário.</text><text x="184" y="809" fill="#eef4ff" font-size="29">Exige uma JVM compatível para rodar.</text><path d="M104 914 H156" stroke="#c3a1ff" stroke-width="5"/><circle cx="104" cy="914" r="12" fill="#c3a1ff"/><rect x="156" y="870" width="860" height="218" rx="20" fill="#111c2e" stroke="#29384e"/><rect x="156" y="888" width="5" height="182" rx="2" fill="#c3a1ff"/><text x="184" y="918" fill="#c3a1ff" font-size="33" font-weight="bold">ClassLoader · carregar</text><text x="184" y="969" fill="#eef4ff" font-size="29">Localiza e define classes sob demanda.</text><text x="184" y="1013" fill="#eef4ff" font-size="29">Delegação usual: bootstrap →</text><text x="184" y="1057" fill="#eef4ff" font-size="29">platform → application.</text><path d="M104 1162 H156" stroke="#ffc879" stroke-width="5"/><circle cx="104" cy="1162" r="12" fill="#ffc879"/><rect x="156" y="1118" width="860" height="218" rx="20" fill="#111c2e" stroke="#29384e"/><rect x="156" y="1136" width="5" height="182" rx="2" fill="#ffc879"/><text x="184" y="1166" fill="#ffc879" font-size="33" font-weight="bold">JVM e JIT · executar</text><text x="184" y="1217" fill="#eef4ff" font-size="29">A JVM executa o bytecode.</text><text x="184" y="1261" fill="#eef4ff" font-size="29">O JIT compila trechos quentes</text><text x="184" y="1305" fill="#eef4ff" font-size="29">para código de máquina otimizado.</text><path d="M104 1410 H156" stroke="#f69fba" stroke-width="5"/><circle cx="104" cy="1410" r="12" fill="#f69fba"/><rect x="156" y="1366" width="860" height="218" rx="20" fill="#111c2e" stroke="#29384e"/><rect x="156" y="1384" width="5" height="182" rx="2" fill="#f69fba"/><text x="184" y="1414" fill="#f69fba" font-size="33" font-weight="bold">No Canna · conectar as ideias</text><text x="184" y="1465" fill="#eef4ff" font-size="29">Você desenvolve usando o JDK.</text><text x="184" y="1509" fill="#eef4ff" font-size="29">A JVM executa o backend Java.</text><text x="184" y="1553" fill="#eef4ff" font-size="29">O JIT otimiza durante a execução.</text><text x="64" y="1706" fill="#61d5bf" font-size="29" font-weight="bold">Lembre: bytecode não é código nativo.</text><text x="64" y="1760" fill="#a7b7cc" font-size="23">Módulo 01 · Revisão para entrevistas · Amplie sem perder nitidez</text></g></svg>

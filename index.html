<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1120"><meta name="description" content="Biblioteca de estudos sobre Java, com explicações, exemplos e mapas mentais.">
<title>Java Study Hub</title>
<style>
:root{color-scheme:dark;--bg:#0b1120;--panel:#111c2e;--panel2:#17253a;--line:#29384e;--text:#eef4ff;--muted:#a7b7cc;--accent:#61d5bf;--code:#0a1423}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--panel);border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:1.3rem;font-weight:800;letter-spacing:-.03em}.brand span{color:var(--accent)}.subtitle{color:var(--muted);font-size:.85rem;margin:2px 0 22px}.search{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:18px}.module{margin-bottom:20px}.module-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 8px 9px}.topic{display:block;width:100%;text-align:left;background:transparent;color:var(--muted);border:0;border-radius:10px;padding:10px 12px;line-height:1.4}.topic:hover,.topic.active{background:var(--panel2);color:var(--text)}.topic.active{border-left:3px solid var(--accent)}main{width:min(100%,1020px);margin:0 auto;padding:46px 52px 80px}.eyebrow{color:var(--accent);font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}h1{font-size:clamp(2rem,4vw,3rem);line-height:1.2;letter-spacing:-.04em;margin:10px 0}h2{font-size:1.35rem;margin:34px 0 12px;line-height:1.3}p{margin:10px 0 17px}.lead{color:var(--muted);font-size:1.08rem}.section{margin:28px 0}.section p{white-space:pre-line}.section ul{padding-left:24px}.section li{margin:7px 0}.note{background:var(--panel);border-left:3px solid var(--accent);padding:16px 20px;border-radius:8px;margin:24px 0}.code-wrap{position:relative;margin:18px 0}.code-wrap pre{background:var(--code);border:1px solid var(--line);padding:22px;border-radius:12px;overflow-x:auto;line-height:1.6;font-size:.9rem}.copy{position:absolute;right:10px;top:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:7px;padding:4px 10px;font-size:.8rem}.map{margin-top:36px;border-top:1px solid var(--line);padding-top:25px}.map img{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line);cursor:zoom-in}.map button,.nav button,.menu-btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 14px}.map-placeholder{border:1px dashed var(--line);border-radius:12px;padding:25px;color:var(--muted)}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:42px}.nav button:disabled{opacity:.35;cursor:default}.menu-btn{display:none}.empty{color:var(--muted)}dialog{background:var(--bg);border:1px solid var(--line);border-radius:12px;max-width:96vw;max-height:94vh;padding:16px;color:var(--text)}dialog::backdrop{background:#000c}dialog img{max-width:90vw;max-height:80vh;object-fit:contain}dialog button{float:right;margin-bottom:10px;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:5px 12px;border-radius:8px}a{color:var(--accent)}@media(max-width:760px){.app{display:block}.sidebar{position:fixed;z-index:10;left:0;top:0;width:min(85vw,320px);transform:translateX(-105%);transition:transform .2s;box-shadow:12px 0 25px #0004}.sidebar.open{transform:none}main{padding:22px 20px 55px}.menu-btn{display:inline-block;margin-bottom:20px}.nav button{font-size:.85rem}}
</style>
</head>
<body>
<div class="app"><aside class="sidebar" id="sidebar"><div class="brand">Java <span>Study Hub</span></div><div class="subtitle">Sua biblioteca de conhecimento</div><label for="search" class="eyebrow">Buscar assuntos</label><input id="search" class="search" type="search" placeholder="Ex.: Garbage Collector" autocomplete="off"><nav id="topics" aria-label="Módulos e assuntos"></nav></aside><main id="main"><button class="menu-btn" id="menu" aria-expanded="false" aria-controls="sidebar">☰ Assuntos</button><article id="article" aria-live="polite"><p>Carregando conteúdo...</p></article><div class="nav"><button id="prev">← Anterior</button><button id="next">Próximo →</button></div></main></div>
<dialog id="viewer" aria-label="Mapa mental ampliado"><button id="close-viewer">Fechar ✕</button><div><img id="viewer-image" alt="Mapa mental ampliado"></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);
let catalog=[],current=null;
function el(tag,cls,text){const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node}
function addText(parent,tag,txt,cls){parent.append(el(tag,cls,txt))}
function allTopics(data){return data.modulos.flatMap(m=>m.assuntos.map(a=>({...a,moduleTitle:m.titulo,moduleId:m.id})))}
function renderMenu(filter=''){
 const nav=$('topics');nav.replaceChildren();const q=filter.trim().toLocaleLowerCase('pt-BR');
 for(const mod of data.modulos){const matching=mod.assuntos.filter(a=>(a.titulo+' '+a.resumo+' '+a.secoes.map(s=>s.titulo+' '+(s.conteudo||'')).join(' ')).toLocaleLowerCase('pt-BR').includes(q));if(!matching.length)continue;
 const group=el('section','module');addText(group,'h2',mod.titulo,'module-title');for(const topic of matching){const btn=el('button','topic'+(current===topic.id?' active':''),topic.titulo);btn.type='button';btn.onclick=()=>selectTopic(topic.id);group.append(btn)}nav.append(group)}
 if(!nav.children.length)addText(nav,'p','Nenhum assunto encontrado.','empty');
}
function renderArticle(topic){const root=$('article');root.replaceChildren();addText(root,'div',topic.moduleTitle,'eyebrow');addText(root,'h1',topic.titulo);addText(root,'p',topic.resumo,'lead');
 for(const s of topic.secoes){const sec=el('section','section');addText(sec,'h2',s.titulo);if(s.conteudo)addText(sec,'p',s.conteudo);if(s.itens){const ul=el('ul');s.itens.forEach(item=>addText(ul,'li',item));sec.append(ul)}if(s.codigo){const wrap=el('div','code-wrap'),pre=el('pre'),code=el('code',null,s.codigo),copy=el('button','copy','Copiar');copy.onclick=async()=>{try{await navigator.clipboard.writeText(s.codigo);copy.textContent='Copiado!';setTimeout(()=>copy.textContent='Copiar',1500)}catch{copy.textContent='Selecione o código'}};pre.append(code);wrap.append(pre,copy);sec.append(wrap)}if(s.destaque)addText(sec,'div',s.destaque,'note');root.append(sec)}
 const map=el('section','map');addText(map,'h2','Mapa mental');if(topic.mapaMental){const img=el('img');img.src=topic.mapaMental;img.alt='Mapa mental: '+topic.titulo;img.loading='lazy';img.onerror=()=>{img.replaceWith(el('div','map-placeholder','Mapa mental ainda não adicionado. Inclua a imagem em '+topic.mapaMental))};img.onclick=()=>{$('viewer-image').src=img.src;$('viewer-image').alt=img.alt;$('viewer').showModal()};map.append(img);addText(map,'p','Clique na imagem para ampliar.','empty')}else addText(map,'div','Mapa mental em preparação.','map-placeholder');root.append(map)
}
function selectTopic(id){const topic=catalog.find(t=>t.id===id)||catalog[0];if(!topic)return;current=topic.id;renderArticle(topic);renderMenu($('search').value);const idx=catalog.findIndex(t=>t.id===current);$('prev').disabled=idx===0;$('next').disabled=idx===catalog.length-1;history.replaceState(null,'','#'+encodeURIComponent(current));$('sidebar').classList.remove('open');$('menu').setAttribute('aria-expanded','false');window.scrollTo({top:0,behavior:'instant'})}
let data;
async function init(){try{const response=await fetch('./conteudo.json');if(!response.ok)throw Error('HTTP '+response.status);data=await response.json();catalog=allTopics(data);if(!catalog.length)throw Error('Nenhum assunto encontrado');selectTopic(decodeURIComponent(location.hash.slice(1))||catalog[0].id)}catch(error){$('article').replaceChildren(el('h1',null,'Não foi possível carregar o conteúdo'),el('p',null,'Verifique se conteudo.json está no mesmo diretório do index.html e abra o projeto via servidor HTTP ou GitHub Pages.'),el('pre',null,String(error)));$('prev').disabled=$('next').disabled=true}}
$('search').addEventListener('input',e=>renderMenu(e.target.value));$('prev').onclick=()=>selectTopic(catalog[catalog.findIndex(t=>t.id===current)-1]?.id);$('next').onclick=()=>selectTopic(catalog[catalog.findIndex(t=>t.id===current)+1]?.id);$('menu').onclick=()=>{const open=$('sidebar').classList.toggle('open');$('menu').setAttribute('aria-expanded',String(open))};$('close-viewer').onclick=()=>$('viewer').close();window.addEventListener('hashchange',()=>{const id=decodeURIComponent(location.hash.slice(1));if(id!==current&&catalog.some(t=>t.id===id))selectTopic(id)});init();
</script>
</body></html>

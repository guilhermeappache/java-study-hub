<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1120"><meta name="description" content="Biblioteca de estudos sobre Java, com explicações, exemplos e mapas mentais.">
<title>Java Study Hub</title>
<style>
:root{color-scheme:dark;--bg:#0b1120;--panel:#111c2e;--panel2:#17253a;--line:#29384e;--text:#eef4ff;--muted:#a7b7cc;--accent:#61d5bf;--code:#0a1423}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--panel);border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:1.3rem;font-weight:800;letter-spacing:-.03em}.brand span{color:var(--accent)}.subtitle{color:var(--muted);font-size:.85rem;margin:2px 0 22px}.search{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:18px}.module{margin-bottom:20px}.module-title{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 7px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);font-weight:700}.module-title[aria-expanded=true]{color:var(--accent);border-color:var(--accent)}.module-title .chevron{transition:transform .2s}.module-title[aria-expanded=true] .chevron{transform:rotate(180deg)}.module-items[hidden]{display:none}.topic{display:block;width:100%;text-align:left;background:transparent;color:var(--muted);border:0;border-radius:10px;padding:10px 12px;line-height:1.4}.topic:hover,.topic.active{background:var(--panel2);color:var(--text)}.topic.active{border-left:3px solid var(--accent)}main{width:min(100%,1020px);margin:0 auto;padding:46px 52px 80px}.eyebrow{color:var(--accent);font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}h1{font-size:clamp(2rem,4vw,3rem);line-height:1.2;letter-spacing:-.04em;margin:10px 0}h2{font-size:1.35rem;margin:34px 0 12px;line-height:1.3}p{margin:10px 0 17px}.lead{color:var(--muted);font-size:1.08rem}.section{margin:28px 0}.section p{white-space:pre-line}.section ul{padding-left:24px}.section li{margin:7px 0}.note{background:var(--panel);border-left:3px solid var(--accent);padding:16px 20px;border-radius:8px;margin:24px 0}.code-wrap{position:relative;margin:18px 0}.code-wrap pre{background:var(--code);border:1px solid var(--line);padding:22px;border-radius:12px;overflow-x:auto;line-height:1.6;font-size:.9rem}.copy{position:absolute;right:10px;top:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:7px;padding:4px 10px;font-size:.8rem}.map{margin-top:36px;border-top:1px solid var(--line);padding-top:25px}.map img{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line);cursor:zoom-in}.map button,.nav button,.menu-btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 14px}.map-placeholder{border:1px dashed var(--line);border-radius:12px;padding:25px;color:var(--muted)}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:42px}.nav button:disabled{opacity:.35;cursor:default}.menu-btn{display:none}.empty{color:var(--muted)}dialog{background:var(--bg);border:1px solid var(--line);border-radius:12px;max-width:96vw;max-height:94vh;padding:16px;color:var(--text)}dialog::backdrop{background:#000c}dialog img{max-width:90vw;max-height:80vh;object-fit:contain}dialog button{float:right;margin-bottom:10px;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:5px 12px;border-radius:8px}a{color:var(--accent)}@media(max-width:760px){.app{display:block}.sidebar{position:fixed;z-index:10;left:0;top:0;width:min(85vw,320px);transform:translateX(-105%);transition:transform .2s;box-shadow:12px 0 25px #0004}.sidebar.open{transform:none}main{padding:22px 20px 55px}.menu-btn{display:inline-block;margin-bottom:20px}.nav button{font-size:.85rem}}

.map-actions,.viewer-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
.map-actions a{display:inline-block;padding:9px 14px;border:1px solid var(--line);border-radius:9px}
.map-open{display:block;width:100%;padding:0!important;border:0!important;background:transparent!important}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
dialog{width:96vw;padding:12px}dialog button{float:none;margin:0;min-height:44px}
.viewer-actions{position:sticky;top:0;background:var(--bg);margin:0;padding:8px 0}
.viewer-scroll{overflow:auto;max-height:76vh;overscroll-behavior:contain}
dialog img{display:block;width:100%;max-width:none;max-height:none;height:auto}
header.site-header{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 30px;border-bottom:1px solid var(--line);background:var(--panel)}.site-header .site-name{font-weight:800;letter-spacing:-.02em}.social-link{display:inline-flex;align-items:center;gap:9px;color:var(--text);text-decoration:none;padding:8px 12px;border:1px solid var(--line);border-radius:9px}.social-link:hover{border-color:var(--accent);color:var(--accent)}.social-link svg{width:22px;height:22px;fill:#0a66c2}.content-shell{min-width:0;display:flex;flex-direction:column;min-height:100vh}.content-shell main{flex:1}.site-footer{border-top:1px solid var(--line);padding:22px 30px;background:var(--panel);text-align:center}.verse-text{font-size:1rem;margin:0 auto 8px;max-width:760px}.verse-ref{font-size:.85rem;color:var(--muted)}.verse-ref a{color:var(--accent)}@media(max-width:760px){header.site-header{padding:13px 18px}.site-footer{padding:20px 16px}}
</style>
</head>
<body>
<div class="app"><aside class="sidebar" id="sidebar"><div class="brand">Java <span>Study Hub</span></div><div class="subtitle">Sua biblioteca de conhecimento</div><label for="search" class="eyebrow">Buscar assuntos</label><input id="search" class="search" type="search" placeholder="Ex.: Garbage Collector" autocomplete="off"><nav id="topics" aria-label="Módulos e assuntos"></nav></aside><div class="content-shell"><header class="site-header"><span class="site-name">Java Study Hub</span><a class="social-link" href="https://www.linkedin.com/in/guilherme-augusto-de-melo-03bb99199/" target="_blank" rel="noopener noreferrer" aria-label="Perfil no LinkedIn"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.45 2H3.55C2.69 2 2 2.68 2 3.52v16.96c0 .84.69 1.52 1.55 1.52h16.9c.86 0 1.55-.68 1.55-1.52V3.52c0-.84-.69-1.52-1.55-1.52ZM7.93 18.75H4.98V9.2h2.95v9.55ZM6.45 7.9a1.71 1.71 0 1 1 0-3.42 1.71 1.71 0 0 1 0 3.42Zm12.3 10.85H15.8V14.1c0-1.1-.02-2.53-1.54-2.53-1.54 0-1.78 1.2-1.78 2.45v4.73H9.53V9.2h2.83v1.3h.04c.39-.74 1.36-1.53 2.8-1.53 2.99 0 3.55 1.97 3.55 4.53v5.25Z"/></svg><span>LinkedIn</span></a></header><main id="main"><button class="menu-btn" id="menu" aria-expanded="false" aria-controls="sidebar">☰ Assuntos</button><article id="article" aria-live="polite"><p>Carregando conteúdo...</p></article><div class="nav"><button id="prev">← Anterior</button><button id="next">Próximo →</button></div></main><footer class="site-footer" aria-label="Versículo bíblico"><p class="verse-text" id="verse-text"></p><div class="verse-ref"><span id="verse-ref"></span> · <a id="verse-link" target="_blank" rel="noopener noreferrer">Ler na NAA</a></div></footer></div></div>
<dialog id="viewer" aria-label="Mapa mental ampliado"><div class="viewer-actions"><button id="close-viewer">Fechar ✕</button><button id="zoom-out" aria-label="Diminuir zoom">−</button><button id="zoom-reset">Ajustar</button><button id="zoom-in" aria-label="Aumentar zoom">+</button><span id="zoom-label" aria-live="polite">100%</span></div><div class="viewer-scroll" id="viewer-scroll"><img id="viewer-image" alt="Mapa mental ampliado"></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);
let catalog=[],current=null,expandedModule=null;
function el(tag,cls,text){const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node}
function addText(parent,tag,txt,cls){parent.append(el(tag,cls,txt))}
function allTopics(data){return data.modulos.flatMap(m=>m.assuntos.map(a=>({...a,moduleTitle:m.titulo,moduleId:m.id})))}
function renderMenu(filter=''){
 const nav=$('topics');nav.replaceChildren();const q=filter.trim().toLocaleLowerCase('pt-BR');
 for(const mod of data.modulos){
  const matching=mod.assuntos.filter(a=>(a.titulo+' '+a.resumo+' '+a.secoes.map(s=>s.titulo+' '+(s.conteudo||'')).join(' ')).toLocaleLowerCase('pt-BR').includes(q));
  if(!matching.length)continue;
  const group=el('section','module'),heading=el('button','module-title'),items=el('div','module-items');
  heading.type='button';heading.append(document.createTextNode(mod.titulo),el('span','chevron','⌄'));
  const open=q.length>0||expandedModule===mod.id;heading.setAttribute('aria-expanded',String(open));items.hidden=!open;
  heading.onclick=()=>{expandedModule=expandedModule===mod.id?null:mod.id;renderMenu($('search').value)};
  for(const topic of matching){const btn=el('button','topic'+(current===topic.id?' active':''),topic.titulo);btn.type='button';btn.onclick=()=>selectTopic(topic.id);items.append(btn)}
  group.append(heading,items);nav.append(group);
 }
 if(!nav.children.length)addText(nav,'p','Nenhum assunto encontrado.','empty');
}
function renderArticle(topic){const root=$('article');root.replaceChildren();addText(root,'div',topic.moduleTitle,'eyebrow');addText(root,'h1',topic.titulo);addText(root,'p',topic.resumo,'lead');
 for(const s of topic.secoes){const sec=el('section','section');addText(sec,'h2',s.titulo);if(s.conteudo)addText(sec,'p',s.conteudo);if(s.itens){const ul=el('ul');s.itens.forEach(item=>addText(ul,'li',item));sec.append(ul)}if(s.codigo){const wrap=el('div','code-wrap'),pre=el('pre'),code=el('code',null,s.codigo),copy=el('button','copy','Copiar');copy.onclick=async()=>{try{await navigator.clipboard.writeText(s.codigo);copy.textContent='Copiado!';setTimeout(()=>copy.textContent='Copiar',1500)}catch{copy.textContent='Selecione o código'}};pre.append(code);wrap.append(pre,copy);sec.append(wrap)}if(s.destaque)addText(sec,'div',s.destaque,'note');root.append(sec)}
 const map=el('section','map');addText(map,'h2','Mapa mental');
 if(topic.mapaMental){
 const img=el('img');img.src=topic.mapaMental;img.alt='Mapa mental: '+topic.titulo;img.loading='lazy';img.width=2160;img.height=3600;
 const open=el('button','map-open');open.type='button';open.setAttribute('aria-label','Ampliar mapa mental: '+topic.titulo);
 open.append(img);open.onclick=()=>{$('viewer-image').src=img.src;$('viewer-image').alt=img.alt;setZoom(100);$('viewer').showModal();$('viewer-scroll').scrollTo(0,0)};
 const actions=el('div','map-actions'),enlarge=el('button',null,'Ampliar mapa'),download=el('a',null,'Baixar SVG'),png=el('button',null,'Baixar PNG · 2160 × 3600');
 enlarge.onclick=()=>open.click();download.href=topic.mapaMental;download.download=topic.id+'-mapa.svg';
 png.onclick=async()=>{png.disabled=true;png.textContent='Preparando PNG…';try{
 const source=new Image();source.src=topic.mapaMental;await source.decode();
 const canvas=document.createElement('canvas');canvas.width=2160;canvas.height=3600;canvas.getContext('2d').drawImage(source,0,0,2160,3600);
 const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('Falha ao exportar');
 const url=URL.createObjectURL(blob),link=el('a');link.href=url;link.download=topic.id+'-2160x3600.png';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
 png.textContent='Baixar PNG · 2160 × 3600';
 }catch{png.textContent='Tentar baixar PNG novamente'}finally{png.disabled=false}};
 actions.append(enlarge,download,png);
 img.onerror=()=>{open.replaceWith(el('div','map-placeholder','Não foi possível carregar o mapa. Atualize a página para tentar novamente.'));actions.hidden=true};
 map.append(open,actions);addText(map,'p','Toque para ampliar. Use + e − para ajustar o zoom e role para explorar. O SVG mantém a nitidez em qualquer tamanho.','empty');
 }else addText(map,'div','Mapa mental em preparação.','map-placeholder');root.append(map)

}
function selectTopic(id){const topic=catalog.find(t=>t.id===id)||catalog[0];if(!topic)return;current=topic.id;expandedModule=topic.moduleId;renderArticle(topic);renderMenu($('search').value);const idx=catalog.findIndex(t=>t.id===current);$('prev').disabled=idx===0;$('next').disabled=idx===catalog.length-1;history.replaceState(null,'','#'+encodeURIComponent(current));$('sidebar').classList.remove('open');$('menu').setAttribute('aria-expanded','false');window.scrollTo({top:0,behavior:'instant'})}
let zoom=100;
function setZoom(value){zoom=Math.max(100,Math.min(400,value));$('viewer-image').style.width=zoom+'%';$('zoom-label').textContent=zoom+'%';$('zoom-out').disabled=zoom===100;$('zoom-in').disabled=zoom===400}
$('zoom-in').onclick=()=>setZoom(zoom+50);$('zoom-out').onclick=()=>setZoom(zoom-50);$('zoom-reset').onclick=()=>setZoom(100);
const verses=[
 {text:'O SENHOR é o meu pastor; nada me faltará.',ref:'Salmos 23:1',url:'https://www.bible.com/pt/bible/1840/PSA.23.1.NAA'},
 {text:'Tudo posso naquele que me fortalece.',ref:'Filipenses 4:13',url:'https://www.bible.com/pt/bible/1840/PHP.4.13.NAA'},
 {text:'Alegrem-se sempre no Senhor.',ref:'Filipenses 4:4',url:'https://www.bible.com/pt/bible/1840/PHP.4.4.NAA'},
 {text:'O amor é paciente, é bondoso.',ref:'1 Coríntios 13:4',url:'https://www.bible.com/pt/bible/1840/1CO.13.4.NAA'},
 {text:'Orem sem cessar.',ref:'1 Tessalonicenses 5:17',url:'https://www.bible.com/pt/bible/1840/1TH.5.17.NAA'}
];
let verseIndex=0;
function showVerse(){const v=verses[verseIndex];$('verse-text').textContent='“'+v.text+'”';$('verse-ref').textContent=v.ref+' · NAA';$('verse-link').href=v.url;verseIndex=(verseIndex+1)%verses.length}
showVerse();setInterval(showVerse,180000);
let data;
async function init(){try{const response=await fetch('./conteudo.json?v=1.1');if(!response.ok)throw Error('HTTP '+response.status);data=await response.json();catalog=allTopics(data);if(!catalog.length)throw Error('Nenhum assunto encontrado');selectTopic(decodeURIComponent(location.hash.slice(1))||catalog[0].id)}catch(error){$('article').replaceChildren(el('h1',null,'Não foi possível carregar o conteúdo'),el('p',null,'Verifique se conteudo.json está no mesmo diretório do index.html e abra o projeto via servidor HTTP ou GitHub Pages.'),el('pre',null,String(error)));$('prev').disabled=$('next').disabled=true}}
$('search').addEventListener('input',e=>renderMenu(e.target.value));$('prev').onclick=()=>selectTopic(catalog[catalog.findIndex(t=>t.id===current)-1]?.id);$('next').onclick=()=>selectTopic(catalog[catalog.findIndex(t=>t.id===current)+1]?.id);$('menu').onclick=()=>{const open=$('sidebar').classList.toggle('open');$('menu').setAttribute('aria-expanded',String(open))};$('close-viewer').onclick=()=>$('viewer').close();window.addEventListener('hashchange',()=>{const id=decodeURIComponent(location.hash.slice(1));if(id!==current&&catalog.some(t=>t.id===id))selectTopic(id)});init();
</script>
</body></html>
